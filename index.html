<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longzz TopUp Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="app-header">
        <div class="store-info">
            <img src="https://via.placeholder.com/40" alt="Logo" class="store-logo">
            <span class="store-name">Longzz Store</span>
        </div>
        <div class="header-icons">
            <span>🔍</span>
            <span>☀️</span>
            <span>🔔</span>
            <span>☰</span>
        </div>
    </header>

    <!-- Main Container Grid -->
    <main class="container">
        <!-- Game Card 1 -->
        <div class="game-card">
            <div class="game-img-box">
                <span class="game-icon">🎮</span>
            </div>
            <h3 class="game-title">Free Fire</h3>
            <button class="btn-topup" onclick="openTopUp('Free Fire')">⚡ TOP UP</button>
        </div>

        <!-- Game Card 2 -->
        <div class="game-card">
            <div class="game-img-box">
                <span class="game-icon">⚔️</span>
            </div>
            <h3 class="game-title">Mobile Legends</h3>
            <button class="btn-topup" onclick="openTopUp('Mobile Legends')">⚡ TOP UP</button>
        </div>
    </main>

    <!-- Modal / Form Section (Hidden by default) -->
    <div id="topupModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeTopUp()">&times;</span>
            <h2 id="modalTitle">Top Up</h2>
            <form id="topupForm">
                <div class="form-group">
                    <label for="playerId">Player ID</label>
                    <input type="text" id="playerId" placeholder="បញ្ចូល Player ID ទីនេះ" required>
                </div>
                <div class="form-group">
                    <label for="packageSelect">ជ្រើសរើសកញ្ចប់</label>
                    <select id="packageSelect" required>
                        <option value="" disabled selected>-- ជ្រើសរើស --</option>
                        <option value="100 Diamonds - $1.00">100 Diamonds - $1.00</option>
                        <option value="310 Diamonds - $3.00">310 Diamonds - $3.00</option>
                        <option value="520 Diamonds - $5.00">520 Diamonds - $5.00</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">បញ្ជាទិញឥឡូវនេះ</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
